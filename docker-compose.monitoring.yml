# Optional monitoring stack. The core application does not need it.
#
#   docker compose -f docker-compose.yml -f docker-compose.monitoring.yml up --build -d
#
#   Prometheus  http://localhost:9090   (Status > Targets should show job "cloudrescue" UP)
#   Grafana     http://localhost:3001   (user admin; password from GRAFANA_ADMIN_PASSWORD, default "admin": change it)
services:
  prometheus:
    image: prom/prometheus:v2.54.1
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"
    depends_on:
      - backend

  grafana:
    image: grafana/grafana:11.2.0
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "3001:3000"
    depends_on:
      - prometheus
